services:
  user-db:
    image: postgres:16-alpine
    container_name: user_db
    volumes:
      - "user-data:/var/lib/postgres/data"
    environment:
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_NAME: postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://userdb:5432"]
      retries: 3
      timeout: 5s
      interval: 5s

  order-db:
    image: postgres:16-alpine
    container_name: order_db
    volumes:
      - "user-data:/var/lib/postgres/data"
    environment:
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_NAME: postgres

  eureka-service:
    build: "./EurekaServer"
    container_name: eureka-service
    ports:
      - "8761:8761"
    environment:
      DB_URL: jdbc://user-db:5432/postgres
      DB_USERNAME: postgres
      DB_NAME: postgres
      DB_PASSWORD: password

  user-service:
    build: "./UserService"
    container_name: user-service
    ports:
      - "9091:9091"
    environment:
      DB_URL: jdbc:postgresql://user-db:5432/postgres
      DB_USERNAME: postgres
      DB_NAME: postgres
      DB_PASSWORD: password
    depends_on:
      - user-db
volumes:
  user-data:
  order-data:

